 background-repeat:no-repeat,no-repeat,no-repeat;
 background-position:left center,right center,center top;
 background-size:auto 100%,auto 100%,cover;
 background-attachment:fixed,fixed,fixed}
body:before{content:"";position:fixed;inset:0;pointer-events:none;
 background:radial-gradient(75% 55% at 50% 0%,rgba(30,140,200,.10),transparent 70%)}
.page{position:relative;width:min(1160px,100% - 26px);margin:0 auto;padding:6px 0 26px}
.logo{display:block;margin:6px auto 2px;width:min(430px,72%);filter:drop-shadow(0 6px 24px rgba(0,0,0,.6))}
.frame{border:1px solid #2c6188;border-radius:16px;padding:13px;
 background:linear-gradient(180deg,rgba(6,19,34,.90),rgba(3,10,20,.94));
 box-shadow:0 0 0 1px rgba(4,14,26,.9) inset,0 26px 70px rgba(0,0,0,.65)}

/* ---------- topbar ---------- */
.topbar{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1.15fr) auto;gap:10px;margin-bottom:12px}
.pill{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line1);border-radius:10px;
 background:linear-gradient(180deg,rgba(9,27,46,.95),rgba(4,13,25,.95))}
.pill .ico{width:28px;height:28px;display:grid;place-items:center;border-radius:8px;border:1px solid #2d5f80;
 background:#071c2e;color:var(--gold);flex:none}
.pill .lbl{font-size:10px;letter-spacing:.6px;color:var(--muted)}
.pill b{font-size:14px;color:#f1e3b9}
.select{position:relative;flex:1;min-width:0;cursor:pointer}
.select .cur{display:flex;align-items:center;justify-content:space-between;gap:8px}
.select .cur b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.menu{position:absolute;z-index:40;left:-12px;right:-12px;top:calc(100% + 11px);display:none;
 border:1px solid var(--line1);border-radius:10px;background:#061829;box-shadow:0 18px 40px #000c;overflow:hidden}
.menu.open{display:block}
.menu div{padding:10px 12px;font-size:13px;border-bottom:1px solid #102b42}
.menu div:last-child{border-bottom:0}
.menu div:hover{background:#0d2c46}
.menu .add{color:var(--green)}
input,select{background:#020a13;border:1px solid #2a5471;color:#eaf5fc;border-radius:8px;padding:9px 10px;
 outline:none;font:inherit;font-size:14px;width:100%;min-width:0}
input:focus{border-color:var(--cyan);box-shadow:0 0 0 2px rgba(76,194,241,.18)}
button{font:inherit;cursor:pointer;border-radius:9px;padding:9px 14px;color:#dff1fd;
 border:1px solid #2f6a8e;background:linear-gradient(180deg,#10314c,#08192a)}
button{background:linear-gradient(180deg,#10314c,#08192a)}
button:hover{filter:brightness(1.18)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.42;cursor:not-allowed;filter:none}
button:focus-visible,.select:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.btn-green{border-color:#178d68;background:linear-gradient(180deg,#0f6b51,#0a4a38);color:#c9ffe9;font-weight:600}
.btn-gold{border-color:#8a6a24;background:linear-gradient(180deg,#523a12,#2d200a);color:#ffe2a4}

/* ---------- cards ---------- */
.main{display:grid;grid-template-columns:minmax(0,1fr) 258px;gap:11px;align-items:start}
.left{display:grid;grid-template-columns:minmax(0,1.62fr) minmax(0,1fr);gap:11px;align-items:start}
.left .wide{grid-column:1/-1}
.side{display:grid;gap:11px}
.card{border:1px solid var(--line2);border-radius:12px;padding:14px;
 background:linear-gradient(180deg,rgba(7,22,38,.92),rgba(4,12,23,.94));
 box-shadow:0 10px 26px rgba(0,0,0,.35)}
.card h2{margin:0 0 12px;font-size:13px;font-weight:700;color:#cfe4f2;display:flex;align-items:center;gap:7px;
 padding-bottom:9px;border-bottom:1px solid #12314a}
.card h2 small{color:var(--muted);font-weight:400;font-size:10.5px}

.item{display:flex;gap:16px;align-items:flex-start}
.item-img{width:104px;height:104px;flex:none;border:1px solid #2a5a7d;border-radius:10px;background:#05121f;
 display:grid;place-items:center;overflow:hidden}
.item-img img{width:84px;height:84px;object-fit:contain;image-rendering:pixelated}
.item-img span{font-size:26px;color:#33607f}
.item-name{font-size:23px;font-weight:800;letter-spacing:.5px;color:#f4e2ae;text-transform:uppercase;line-height:1.1}
.item-goal{color:var(--muted);font-size:12.5px;margin-top:5px}
.bar-row{display:flex;align-items:center;gap:12px;margin:14px 0 0}
.bar{flex:1;height:16px;border-radius:9px;background:#02070d;border:1px solid #2b5170;overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(180deg,#5df0a8,#16a86e);
 box-shadow:0 0 14px rgba(40,220,150,.45)}
.pct{font-size:15px;font-weight:700;color:#e9f6ff;min-width:44px;text-align:right}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:14px;border:1px solid #16364f;border-radius:10px;
 background:rgba(3,11,20,.6)}
.stats>div{padding:11px 13px;border-right:1px solid #16364f}
.stats>div:last-child{border-right:0}
.stats small{display:block;color:var(--muted);font-size:11px;margin-bottom:7px}
.val{display:flex;align-items:center;gap:7px;font-size:14.5px;font-weight:700;margin-bottom:4px;white-space:nowrap}
.val.tc{font-size:13px;font-weight:600;color:#cfe6f5}
.val small{display:inline;color:var(--muted);font-size:10.5px;font-weight:400;margin:0}

/* coins */
.coin{width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:9px;font-weight:800;
 color:#4a3405;background:radial-gradient(circle at 34% 30%,#ffe9a8,#e8b53f 60%,#a97a19);
 box-shadow:0 0 0 1px #6e4f12,0 0 9px rgba(233,181,63,.35)}
.coin.tc{color:#06263a;background:radial-gradient(circle at 34% 30%,#bfe9ff,#4bb4e8 58%,#1b6ea3);
 box-shadow:0 0 0 1px #1d5f8c,0 0 9px rgba(76,194,241,.4)}
.goldtxt{color:var(--gold2)}.cyantxt{color:#8fd8ff}.greentxt{color:#5ff0b4}

/* farm do dia */
.today{border:1px solid #1b3d57;border-radius:10px;background:#051220;padding:11px 12px;display:grid;gap:9px}
.today .val{margin:0}
.field{margin-top:12px}
.field label{display:block;color:var(--muted);font-size:11px;margin-bottom:6px}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.actions button{flex:1}

/* sidebar */
.sum{display:grid;gap:11px}
.sum .line{display:flex;gap:10px;align-items:center}
.sum .line .coin{width:26px;height:26px;font-size:10px}
.sum .line small{display:block;color:var(--muted);font-size:10.5px}
.sum .line b{display:block;font-size:14px;line-height:1.35}
.ring{display:flex;align-items:center;gap:11px;margin-top:3px;padding-top:11px;border-top:1px solid #12314a}
.ring svg{flex:none}
.ring span{font-size:11px;color:var(--muted)}
.rep{display:grid;gap:8px}
.rep button{text-align:left;display:block;line-height:1.25}
.rep button b{display:block;font-size:12.5px}
.rep button small{display:block;font-size:10px;opacity:.75;margin-top:2px}
.rep .blue{border-color:#2f6a8e;background:linear-gradient(180deg,#0e2f49,#081a2b);color:#bfe6ff}
.rep .purple{border-color:#6b46a8;background:linear-gradient(180deg,#2c1a4d,#170e2b);color:#e0cbff}
.rep .red{border-color:#8a3a3f;background:linear-gradient(180deg,#43171c,#260c10);color:#ffb4ae}
.minitabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.minitabs button{padding:7px;font-size:12px;border-color:#1d4462;background:#071a2b;color:#9cbdd4}
.minitabs button.on{color:var(--gold2);border-color:#7d5f20;background:#241a08}
.empty{text-align:center;color:var(--muted);font-size:11.5px;line-height:1.5;padding:16px 4px}
.empty b{display:block;color:#b9d2e4;font-size:12.5px;margin-bottom:4px;font-weight:600}

/* tabs + tabela */
.tabs{display:flex;gap:6px;margin-bottom:11px}
.tabs button{border-color:#1d4462;background:#06172680;color:#9cbdd4;padding:10px 16px;font-size:13px}
.tabs button.on{color:var(--gold2);border-color:#5f80a0;background:linear-gradient(180deg,#0e2c46,#071a2b);
 box-shadow:0 -2px 0 var(--gold) inset}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;color:#9db8cc;font-weight:600;font-size:11.5px;padding:10px 9px;border-bottom:1px solid #1a3b55;
 background:#061826;white-space:nowrap}
td{padding:11px 9px;border-bottom:1px solid #102a3f;vertical-align:middle;white-space:nowrap}
tr.total td{background:#1f1808;color:var(--gold2);border-bottom:1px solid #3a2c0d}
tr.total td:first-child{font-weight:700}
.cell{display:flex;align-items:center;gap:7px}
.today-tag{color:#ff9b8f;font-size:11px}
.mini{padding:7px 11px;font-size:11.5px;border-radius:8px}
.mini.icon{padding:7px 9px}
.rowbtns{display:flex;gap:6px;justify-content:flex-end}

/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;
 padding:16px;z-index:60;backdrop-filter:blur(3px)}
.modal.open{display:flex}
.box{width:min(460px,100%);border:1px solid #2c6188;border-radius:14px;padding:18px;background:#061829}
.box{background:linear-gradient(180deg,#092034,#04101d)}
.box h3{margin:0 0 4px;font-size:17px;color:#f2e1b0}
.box p{margin:0 0 14px;color:var(--muted);font-size:12px}
.sugg{position:relative}
.sugg-list{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:10;background:#06182a;border:1px solid #2a5471;
 border-radius:8px;max-height:190px;overflow:auto;display:none}
.sugg-list.open{display:block}
.sugg-list div{padding:9px 11px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:9px}
.sugg-list div:hover{background:#0e2b44}
.sugg-list img{width:26px;height:26px;object-fit:contain;image-rendering:pixelated}
.preview{display:flex;align-items:center;gap:11px;margin-top:11px;padding:10px;border:1px solid #1e4460;border-radius:9px;
 background:#04121f;font-size:12px}
.preview img{width:42px;height:42px;object-fit:contain;image-rendering:pixelated}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* rodapé */
.foot{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;margin-top:12px;padding:11px 14px;
 border:1px solid var(--line2);border-radius:11px;background:rgba(4,13,24,.9);font-size:11.5px;color:#7f9ab0}
.foot .quote{color:#9ab4c8;font-style:italic;border-left:2px solid var(--gold);padding-left:10px;line-height:1.4}
.foot .ok{color:#7fd9b4}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);z-index:80;opacity:0;
 pointer-events:none;transition:.25s;padding:11px 18px;border-radius:10px;border:1px solid #1e7a5c;
 background:#08301f;color:#b9ffe3;font-size:13px;box-shadow:0 12px 30px #000a}
.toast.on{opacity:1;transform:translateX(-50%)}

 <div id="gPreview" class="preview" style="display:none"></div>

  <div><label style="display:block;color:var(--muted);font-size:11px;margin-bottom:6px">Meta em Gold</label>
   <input id="gGold" type="number" min="1" placeholder="100000000"></div>

 </div>

 <h3>Configurações</h3><p>Metas, dados e manutenção do tracker.</p>

  <button class="blue" onclick="document.getElementById('imp').click()"><b>⇧ Importar backup</b><small>Restaura um arquivo exportado</small></button>

 <div class="actions"><button onclick="fechar('mCfg')">Fechar</button></div>
</div></div>

 return(wtoh(a)+wtoh(b)+wtoh(c)+wtoh(d)).toLowerCase()}

const WIKI="https://www.tibiawiki.com.br";
function nomeArquivo(nome){
 let n=nome.trim().replace(/\s+/g,"_");
 n=n.charAt(0).toUpperCase()+n.slice(1);
 return n+".gif"}
function gifDoItem(nome){
 const f=nomeArquivo(nome),h=md5(f);
 return WIKI+"/images/"+h[0]+"/"+h.substring(0,2)+"/"+encodeURIComponent(f).replace(/%20/g,"_")}
async function fallbackGif(img){
 const nome=img.dataset.nome||"";
 try{
  const u=WIKI+"/api.php?action=query&titles=Arquivo:"+encodeURIComponent(nomeArquivo(nome))+
   "&prop=imageinfo&iiprop=url&format=json&origin=*";
  const j=await(await fetch(u)).json(),p=Object.values((j.query||{}).pages||{})[0],
   url=p&&p.imageinfo&&p.imageinfo[0]&&p.imageinfo[0].url;
  if(url&&url!==img.src){img.onerror=()=>img.parentNode.innerHTML='<span>?</span>';img.src=url;return}
 }catch(e){}
 img.parentNode.innerHTML='<span>?</span>'}
async function buscarItens(termo){
 const url=WIKI+"/api.php?action=opensearch&search="+encodeURIComponent(termo)+
  "&limit=8&namespace=0&format=json&origin=*";
 const r=await fetch(url),j=await r.json();return j[1]||[]}

/* ================= estado + persistência ================= */
const CK="tibiaFarm3_",CHUNK=3200;
let S={metas:[],ativa:null,tcPrice:35000},aba="hist",abaRel="semanal",addDate=null,tSugg=null,menuAberto=false;

function serializar(){return btoa(unescape(encodeURIComponent(JSON.stringify(S))))}
function salvar(){
 const b=serializar();
 try{localStorage.setItem(CK+"data",b)}catch(e){}
 try{
  for(let i=0;i<40;i++)document.cookie=CK+i+"=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/";
  const p=[];for(let i=0;i<b.length;i+=CHUNK)p.push(b.slice(i,i+CHUNK));
  p.forEach((c,i)=>document.cookie=CK+i+"="+c+";max-age=315360000;path=/;SameSite=Lax");
  document.cookie=CK+"n="+p.length+";max-age=315360000;path=/;SameSite=Lax";
 }catch(e){}
}
function carregar(){
 let b="";
 const m=document.cookie.match(new RegExp("(?:^|; )"+CK+"n=([^;]*)"));
 if(m){const n=Number(m[1]);for(let i=0;i<n;i++){
  const c=document.cookie.match(new RegExp("(?:^|; )"+CK+i+"=([^;]*)"));if(c)b+=c[1]}}
 if(!b){try{b=localStorage.getItem(CK+"data")||""}catch(e){}}
 if(!b)return;
 try{const o=JSON.parse(decodeURIComponent(escape(atob(b))));if(o&&o.metas)S=o}catch(e){}
}

/* ================= helpers ================= */
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const fmt=n=>Math.round(Number(n)||0).toLocaleString("pt-BR");
const fmt2=n=>(Number(n)||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const hoje=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const brData=s=>s.split("-").reverse().join("/");
const meta=()=>S.metas.find(m=>m.id===S.ativa)||null;
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("on");
 clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),2600)}
function fechar(id){document.getElementById(id).classList.remove("open")}
function abrir(id){document.getElementById(id).classList.add("open")}

const gold=g=>g.sessoes.filter(s=>!s.somado).reduce((a,s)=>a+Number(s.gold),0);
const tc=g=>gold(g)/S.tcPrice;
const diasFarm=g=>[...new Set(g.sessoes.map(s=>s.data))].sort();
const doDia=(g,d)=>g.sessoes.filter(s=>s.data===d&&!s.somado).sort((a,b)=>a.hora.localeCompare(b.hora));
const goldDia=(g,d)=>doDia(g,d).reduce((a,s)=>a+Number(s.gold),0);
const tcDia=(g,d)=>goldDia(g,d)/S.tcPrice;
const diasDesde=g=>Math.floor((Date.now()-new Date(g.criada).getTime())/86400000);

/* ================= ações ================= */
function novaMeta(){
 document.getElementById("gName").value="";document.getElementById("gGold").value="";
 document.getElementById("gTc").value=S.tcPrice;document.getElementById("gPreview").style.display="none";
 document.getElementById("gSugg").classList.remove("open");abrir("mGoal");
 setTimeout(()=>document.getElementById("gName").focus(),50)}
function criarMeta(){
 const n=document.getElementById("gName").value.trim(),
  g=Number(document.getElementById("gGold").value),p=Number(document.getElementById("gTc").value);
 if(!n)return toast("Informe o nome do item.");
 if(!(g>0))return toast("Informe a meta em gold.");
 if(!(p>0))return toast("Informe o preço da Tibia Coin.");
 S.tcPrice=p;
 S.metas.push({id:Date.now(),nome:n,img:gifDoItem(n),metaGold:g,criada:new Date().toISOString(),
  sessoes:[],semanais:[],mensais:[],cursor:0,concluida:null});
 S.ativa=S.metas[S.metas.length-1].id;salvar();fechar("mGoal");render();toast("Meta criada.")}
function excluirMeta(){
 const g=meta();if(!g)return toast("Nenhuma meta ativa.");
 if(!confirm('Excluir a meta "'+g.nome+'" e todo o histórico dela?'))return;
 S.metas=S.metas.filter(m=>m.id!==g.id);S.ativa=S.metas[0]?S.metas[0].id:null;
 salvar();fechar("mCfg");render();toast("Meta excluída.")}
function trocarMeta(id){S.ativa=id;menuAberto=false;salvar();render()}
function salvarPreco(){
 const p=Number(document.getElementById("tcPrice").value);
 if(!(p>0))return toast("Preço inválido.");
 S.tcPrice=p;salvar();render();toast("Preço da Tibia Coin salvo.")}
function registrarFarm(){
 const g=meta();if(!g)return;
 const v=Number(document.getElementById("farmGold").value);
 if(!(v>0))return toast("Informe o valor farmado.");
 const d=new Date();
 g.sessoes.push({id:Date.now()+Math.random(),data:hoje(),
  hora:d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}),gold:v,tcPrice:S.tcPrice});
 checar(g);salvar();render();toast("Farm registrado.")}
function addNoDia(d){
 addDate=d;document.getElementById("addDate").textContent="Data: "+brData(d);
 document.getElementById("addGold").value="";
 abrir("mAdd");setTimeout(()=>document.getElementById("addGold").focus(),50)}
function confirmarAdd(){
 const g=meta(),v=Number(document.getElementById("addGold").value),p=S.tcPrice;
 if(!(v>0))return toast("Informe o valor em gold.");
 g.sessoes.push({id:Date.now()+Math.random(),data:addDate,
  hora:new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}),gold:v,tcPrice:p});
 checar(g);salvar();fechar("mAdd");render();toast("Farm adicionado.")}
function excluirFarm(id){
 const g=meta();if(!confirm("Excluir este registro?"))return;
 g.sessoes=g.sessoes.filter(s=>String(s.id)!==String(id));salvar();render()}
function somarDia(d){
 const g=meta(),arr=doDia(g,d);
 if(arr.length<2)return toast("O dia precisa de pelo menos 2 registros.");
 const total=arr.reduce((a,s)=>a+Number(s.gold),0),t=arr.reduce((a,s)=>a+Number(s.gold)/Number(s.tcPrice),0);
 arr.forEach(s=>s.somado=true);
 g.sessoes.push({id:Date.now()+Math.random(),data:d,hora:arr[arr.length-1].hora,gold:total,tcPrice:total/t,juntado:arr.length});
 salvar();render();toast("Dia somado em um único registro.")}

function checar(g){
 while(true){
  const ds=diasFarm(g).slice(g.cursor);
  if(ds.length<7)break;
  gerarSemanal(g,ds.slice(0,7),false)}
 if(diasDesde(g)>=30&&!g.mensais.some(m=>m.auto))gerarMensal(g,true);
 if(!g.concluida&&gold(g)>=g.metaGold)g.concluida=new Date().toISOString()}
function gerarSemanal(g,ds,manual){
 const ss=g.sessoes.filter(s=>ds.includes(s.data)&&!s.somado);
 g.semanais.push({n:g.semanais.length+1,de:ds[0],ate:ds[ds.length-1],dias:ds.length,
  gold:ss.reduce((a,s)=>a+Number(s.gold),0),tc:ss.reduce((a,s)=>a+Number(s.gold)/Number(s.tcPrice),0),
  manual:!!manual,em:new Date().toISOString()});
 g.cursor+=ds.length}
function gerarMensal(g,auto){
 g.mensais.push({n:g.mensais.length+1,de:g.criada.slice(0,10),ate:hoje(),dias:diasFarm(g).length,
  gold:gold(g),tc:tc(g),auto:!!auto,em:new Date().toISOString()})}
function relSemanal(){
 const g=meta(),ds=diasFarm(g).slice(g.cursor);
 if(ds.length<3)return toast("Registre pelo menos 3 dias de farm.");
 gerarSemanal(g,ds,true);abaRel="semanal";salvar();render();toast("Relatório semanal gerado.")}
function relMensal(){
 const g=meta();if(!g.sessoes.length)return toast("Ainda não há farm registrado.");
 gerarMensal(g,false);abaRel="mensal";salvar();render();toast("Relatório mensal gerado.")}
function limpar(){
 if(!confirm("Isso apaga TODAS as metas, farms e relatórios deste navegador. Continuar?"))return;
 S={metas:[],ativa:null,tcPrice:S.tcPrice};salvar();render();toast("Dados apagados.")}

 const a=document.createElement("a");
 a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:"application/json"}));
 a.download="tibia-farm-tracker.json";a.click();URL.revokeObjectURL(a.href)}
function importar(el){
 const f=el.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.metas)throw 0;S=o;salvar();fechar("mCfg");render();
  toast("Backup importado.")}catch(e){toast("Arquivo inválido.")}};
 r.readAsText(f);el.value=""}

 menuAberto=false;document.getElementById("goalMenu").classList.remove("open")}});
document.querySelectorAll(".modal").forEach(m=>m.addEventListener("click",e=>{if(e.target===m)m.classList.remove("open")}));

  d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}
relogio();setInterval(relogio,30000);
carregar();render();
